name: Build gInk

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore glnk-fixed-master/src/gInk.csproj

      - name: Build
        run: msbuild glnk-fixed-master/src/gInk.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath=..\..\bin-built\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gInk
          path: glnk-fixed-master/bin-built/
