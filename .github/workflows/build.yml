name: Build gInk

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore src/gInk.csproj

      - name: Build
        run: msbuild src/gInk.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath=..\bin-built\

      - name: Copy lang and runtime files
        run: |
          if (Test-Path bin/lang) { Copy-Item -Recurse -Force bin/lang bin-built/lang }
          if (Test-Path src/Microsoft.Ink.dll) { Copy-Item -Force src/Microsoft.Ink.dll bin-built/ }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gInk
          path: bin-built/
